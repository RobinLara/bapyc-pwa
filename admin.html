<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>BAPyC · Panel de comentarios</title>
  <style>
    :root{ --teal:#126E66; --teal-dark:#0D5558; --paper:#F6F5F1; --card:#fff; --ink:#1A201F;
           --ink2:#586462; --ink3:#8A938F; --line:#E4E2DB; --soft:#F0EFEA; --risk:#C24B3A; --ok:#2E875E; --star:#F2B705; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);
         line-height:1.5;padding:22px 16px 60px}
    .wrap{max-width:820px;margin:0 auto}
    h1{font-size:22px;margin-bottom:2px}
    .sub{color:var(--ink2);font-size:13px;margin-bottom:20px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
    input[type=password]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;margin-bottom:10px}
    input:focus{outline:none;border-color:var(--teal)}
    button{background:var(--teal);color:#fff;border:none;border-radius:12px;padding:12px 18px;font-size:14px;
           font-weight:700;cursor:pointer;font-family:inherit}
    button:hover{background:var(--teal-dark)}
    button.ghost{background:#fff;color:var(--ink2);border:1px solid var(--line)}
    button.danger{background:#fff;color:var(--risk);border:1px solid var(--risk)}
    button.danger:hover{background:var(--risk);color:#fff}
    .del{background:none;border:none;cursor:pointer;font-size:15px;padding:2px 6px;border-radius:8px;opacity:.55;line-height:1}
    .del:hover{opacity:1;background:#f8ddd6}
    .err{color:var(--risk);font-size:13px;margin-top:6px;min-height:18px}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
    .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
    .stat .num{font-size:26px;font-weight:800;line-height:1}
    .stat .cap{font-size:11.5px;color:var(--ink3);font-weight:600;margin-top:4px}
    .bars{display:flex;flex-direction:column;gap:7px}
    .bar-row{display:flex;align-items:center;gap:10px;font-size:13px}
    .bar-row .k{width:120px;flex-shrink:0;color:var(--ink2);text-transform:capitalize}
    .bar-row .track{flex:1;height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
    .bar-row .fill{height:100%;background:var(--teal);border-radius:6px}
    .bar-row .n{width:34px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink3);font-weight:700}
    h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);margin:20px 0 10px}
    .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
    .item-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:7px}
    .stars{color:var(--star);letter-spacing:2px;font-size:15px}
    .chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;background:var(--soft);color:var(--ink2);text-transform:capitalize}
    .when{font-size:12px;color:var(--ink3);margin-left:auto}
    .txt{font-size:14px;color:var(--ink);white-space:pre-wrap;margin:4px 0 8px}
    .meta{font-size:11.5px;color:var(--ink3);display:flex;gap:12px;flex-wrap:wrap}
    .empty{color:var(--ink3);text-align:center;padding:30px}
    .row-top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
    .row-top button{padding:8px 14px;font-size:13px}
    .muted{color:var(--ink3);font-size:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Panel de comentarios · BAPyC</h1>
    <p class="sub">Comentarios de docentes para mejorar la app. Datos técnicos anónimos — sin datos de alumnos.</p>

    <div class="card" id="login">
      <label for="pw" style="font-size:13px;font-weight:700;color:var(--ink2);display:block;margin-bottom:8px">Contraseña de administrador</label>
      <input type="password" id="pw" placeholder="••••••••" autocomplete="current-password">
      <button id="loginBtn">Entrar</button>
      <div class="err" id="loginErr"></div>
    </div>

    <div id="dash" style="display:none">
      <div class="row-top">
        <button class="ghost" id="reload">↻ Actualizar</button>
        <button class="ghost" id="logout">Salir</button>
        <button class="danger" id="delAll">Borrar todos</button>
        <span class="muted" id="updated"></span>
      </div>
      <div class="stats" id="stats"></div>
      <div id="charts"></div>
      <h2>Comentarios recientes</h2>
      <div id="list"></div>
    </div>
  </div>
  <script src="./js/admin.js"></script>
</body>
</html>
